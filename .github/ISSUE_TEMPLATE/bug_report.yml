name: Bug report
description: Something on the dashboard is broken or wrong
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Threat Intel feed, Hunt Hypotheses, OSINT Tools, IOC Extractor, Detection Queries, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the IOC Extractor\n2. Paste ...\n3. Click Extract"
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 131 / Windows 11
  - type: textarea
    id: console
    attributes:
      label: Browser console errors (F12 > Console), if any
      render: text
